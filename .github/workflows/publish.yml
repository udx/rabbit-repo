name: Release npm package

on:
  push:
    branches:
      - main

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    uses: udx/reusable-workflows/.github/workflows/npm-release-ops.yml@82aae084a9057633c4bd46fe6d95ddf9b0fa236e
    with:
      node_version: "24"
      release_branch: main
      dist_dir: .
      provenance: true
      enable_gh_release: true
